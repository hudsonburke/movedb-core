name: movedb-core-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.8,<3.13  # OpenSim requires Python <3.13
  - opensim-org::opensim>=4.0.0
  - numpy>=1.20.0
  - polars>=0.20.0
  - pydantic>=2.0.0
  - ezc3d>=1.5.0
  - numpydantic>=1.0.0
  - pandera-polars>=0.20.0
  - pytest>=6.0
  - pytest-cov
  - black
  - flake8
  - mypy
  - pre-commit
  - conda-build
  - conda-verify
  - hatchling
  - pip
  - jupyter
  - matplotlib
  - seaborn
  - pyyaml  # For local GitHub Actions workflow validation
  - nodejs  # For markdownlint
  - pip:
    - isort  # Not available in conda-forge for latest version
  - markdownlint-cli
