[project]
name = "movedb-core"
version = "0.1.0"
description = "Core library for movement-data ingestion, storage, and querying"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.5.0",
  "ezc3d>=1.6.3",
  "numpydantic>=1.8.0",
  "patito[caching]>=0.8.6",
  "polars>=1.38.1",
  "pydantic>=2.12.5",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
b3d = ["nimblephysics>=0.10.0", "tqdm>=4.60.0"]
