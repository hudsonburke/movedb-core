[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movedb-core"
version = "0.2.0"
description = "Movement Database: batch import biomechanics data into Rerun .rrd files for visualization, cataloging, and querying"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.0",
]

[project.optional-dependencies]
c3d = ["rerun-importer-c3d>=0.1.0"]
osim = ["rerun-importer-osim>=0.1.0"]
b3d = ["rerun-importer-b3d[b3d]>=0.1.0"]
all = [
  "movedb-core[c3d]",
  "movedb-core[osim]",
  "movedb-core[b3d]",
  "rerun-sdk>=0.34.0",
  "duckdb>=1.0.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/movedb"]
