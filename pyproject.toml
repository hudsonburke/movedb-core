[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "movedb-core"
version = "0.2.0"
description = "Movement Database: Parquet-based storage and DuckDB catalog for biomechanics data management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "numpydantic>=1.5",
  "pydantic>=2.0",
  "patito>=0.7",
  "polars>=1.0",
  "duckdb>=1.0.0",
  "click>=8.0",
  "pytest>=9.1.1",
  "ezc3d>=1.7.2",
  "pyarrow>=25.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/movedb"]
