# Rat Hindlimb Session Configuration for BAA01_Baseline
# ====================================================
# Complete configuration for reproducible rat hindlimb biomechanics analysis
# using MoveDB Core. This configuration defines static calibration trials,
# dynamic walking trials, model files, and processing parameters.

# Session metadata
name: "BAA01_Baseline"
subject_id: "BAA01"
output_directory: "../RatHindlimb/data/mocap/results/BAA01_Baseline"

# Model file paths (relative to movedb-core directory)
base_model: "../RatHindlimb/models/osim/rat_hindlimb_bilateral.osim"
marker_set: "../RatHindlimb/models/osim/rat_hindlimb_bilateral_markerset.xml"
task_set: "../RatHindlimb/models/osim/rat_hindlimb_bilateral_taskSet.xml"
actuators: "../RatHindlimb/models/osim/rat_hindlimb_bilateral_actuators.xml"
control_constraints: "../RatHindlimb/models/osim/rat_hindlimb_bilateral_controlconstraints.xml"

# Static trials for scaling
static_trials:
  - name: "Static02"
    c3d_path: "../RatHindlimb/data/mocap/Static02.c3d"
    time_range: null # Auto-detect from events
    marker_set:
      [
        "SPL6",
        "TAIL",
        "RHIP",
        "LHIP",
        "RKNE",
        "LKNE",
        "RANK",
        "LANK",
        "RTOE",
        "LTOE",
      ]

# Dynamic trials (pattern-based discovery)
dynamic_trials:
  - pattern: "Walk05$"  # Start with just Walk05 for testing
    c3d_directory: "../RatHindlimb/data/mocap"
    time_range: null # Auto-detect from events
    marker_set:
      [
        "SPL6",
        "TAIL",
        "RHIP",
        "LHIP",
        "RKNE",
        "LKNE",
        "RANK",
        "LANK",
        "RTOE",
        "LTOE",
      ]

# Processing parameters
lowpass_cutoff: 15.0
ik_accuracy: 1e-5
cmc_time_window: 0.01

# Force plate configuration
body_mapping:
  Left: "foot_l"
  Right: "foot_r"

# Required markers for validation
required_markers:
  [
    "SPL6",
    "TAIL",
    "RHIP",
    "LHIP",
    "RKNE",
    "LKNE",
    "RANK",
    "LANK",
    "RTOE",
    "LTOE",
  ]
