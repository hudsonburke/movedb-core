version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: movedb_postgres
    environment:
      POSTGRES_DB: movedb
      POSTGRES_USER: movedb_user
      POSTGRES_PASSWORD: movedb_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movedb_user -d movedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: movedb_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://movedb_user:movedb_password@postgres:5432/movedb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data  # Mount for C3D files
    command: ["python", "-m", "movedb.api.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
